<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Routinefy - Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <!-- Logo -->
        <h1 class="brand-logo">Routinefy</h1>
        
        <!-- Outer Card Frame -->
        <div class="card-outer">
            <div class="card-inner">
                <form>
                    <!-- Name Field -->
                    <div class="input-group">
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" placeholder="Value" required>
                    </div>

                    <!-- Email Field -->
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Value" required>
                    </div>

                    <!-- Password Field -->
                    <div class="input-group">
                        <label for="password">Create Password</label>
                        <input type="password" id="password" placeholder="Value" required>
                    </div>

                    <!-- Register Button (Redirects to Dashboard) -->
                    <a href="dashboard.html" style="text-decoration: none;">
                        <button type="button" class="btn-submit">Create Account</button>
                    </a>
                </form>

                <!-- Help Links -->
                <div class="links-container">
                    <a href="index.html" class="link-item">Already have an account? Sign In</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
