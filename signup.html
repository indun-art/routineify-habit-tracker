<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Routinefy - Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <!-- Logo -->
        <h1 class="brand-logo">Routinefy</h1>
        
        <!-- Outer Card Frame -->
        <div class="card-outer">
            <div class="card-inner">
                <form>
                    <!-- Name Field -->
                    <div class="input-group">
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" placeholder="Value" required>
                    </div>

                    <!-- Email Field -->
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Value" required>
                    </div>

                    <!-- Password Field -->
                    <div class="input-group">
                        <label for="password">Create Password</label>
                        <input type="password" id="password" placeholder="Value" required>
                    </div>

                    <!-- Register Button (Redirects to Dashboard) -->
                    <button type="submit" class="btn-submit">Create Account</button>
                </form>

                <!-- Help Links -->
                <div class="links-container">
                    <a href="login.html" class="link-item">Already have an account? Sign In</a>
                </div>
            </div>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script>
        document.querySelector('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullname = document.getElementById('fullname').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${window.api.API_BASE_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullname, email, password })
                });

                const data = await response.json();
                if (response.ok) {
                    alert('Registration successful! Please sign in.');
                    window.location.href = 'index.html';
                } else {
                    alert(data.error || 'Registration failed');
                }
            } catch (err) {
                alert('Error connecting to server');
            }
        });
    </script>
</body>
</html>
