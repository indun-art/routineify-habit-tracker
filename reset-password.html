<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Routinefy - Update Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <h1 class="brand-logo">Routinefy</h1>
        
        <div class="card-outer">
            <div class="card-inner">
                <h2 style="margin-bottom: 20px; font-size: 1.5rem;">Enter Verification Code</h2>
                
                <form>
                    <div class="input-group">
                        <label for="v-code">Verification Code (OTP)</label>
                        <input type="text" id="v-code" placeholder="Enter 6-digit code" required>
                    </div>

                    <div class="input-group">
                        <label for="new-password">New Password</label>
                        <input type="password" id="new-password" placeholder="Value" required>
                    </div>

                    <div class="input-group">
                        <label for="confirm-password">Confirm New Password</label>
                        <input type="password" id="confirm-password" placeholder="Value" required>
                    </div>

                    <a href="login.html" style="text-decoration: none;">
                        <button type="button" class="btn-submit">Update Password</button>
                    </a>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
