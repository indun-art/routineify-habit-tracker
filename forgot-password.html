<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Routinefy - Forgot Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <h1 class="brand-logo">Routinefy</h1>
        
        <div class="card-outer">
            <div class="card-inner">
                <h2 style="margin-bottom: 20px; font-size: 1.5rem;">Reset Your Password</h2>
                <p style="margin-bottom: 25px; color: #666; font-size: 0.95rem;">Enter your registered email and phone number to receive a verification code.</p>
                
                <form>
                    <div class="input-group">
                        <label for="reset-email">Email Address</label>
                        <input type="email" id="reset-email" placeholder="Value" required>
                    </div>

                    <div class="input-group">
                        <label for="reset-phone">Phone Number</label>
                        <input type="tel" id="reset-phone" placeholder="Value" required>
                    </div>

                    <a href="reset-password.html" style="text-decoration: none;">
                        <button type="button" class="btn-submit">Send Verification Code</button>
                    </a>
                </form>

                <div class="links-container">
                    <a href="login.html" class="link-item">Back to Sign In</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
